[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "petalab"
version = "1.0.0"
description = "PetaLab - Web App GIS Lokal untuk Membaca, Mengolah, Menganalisis, dan Memodelkan Data Spasial"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyogrio>=0.9.0",
    "pyproj>=3.6.0",
    "duckdb>=1.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "joblib>=1.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
gee = [
    "earthengine-api>=1.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
]

[project.scripts]
petalab = "petalab.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
